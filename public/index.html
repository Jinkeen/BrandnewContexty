<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brandnew Contexty</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="shell">
  <aside class="history"><div class="logo">◈ <b>Contexty</b><small>脚本素材工作区</small></div><button id="newChat" class="history-new">＋ 新对话</button><div class="rail-label">工作区</div><div class="history-item active">当前脚本素材</div><div class="rail-bottom"><button id="exportData">导出画布</button><button id="importData">导入画布</button><input type="file" id="importFile" accept="application/json" hidden></div></aside>
  <aside class="overview"><div class="tabs"><button id="tabTimeline">时间线</button><button id="tabOverview" class="selected">概览 <span id="overviewCount"></span></button></div><div class="understanding"><div class="section-label">▾ AI CONTEXT UNDERSTANDING</div><textarea id="topic" rows="3" placeholder="当前脚本主题与创作意图"></textarea><div id="groupOutline"></div></div><div class="outline-list"><div class="section-label">素材结构</div><div id="outlineItems"></div></div></aside>
  <main class="board"><div class="board-top"><span>Context Canvas</span><div><button id="undoBtn" title="撤销">↶</button><button id="redoBtn" title="重做">↷</button><button id="addGroup" title="创建分组">＋ 分组</button></div></div><div id="viewport" class="viewport"><div id="world" class="world"></div></div><div class="board-bottom"><div class="zoom"><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">＋</button><button id="fitView">适合屏幕</button></div><div class="tools"><button id="selectTool" class="active" title="选择并移动">↖</button><button id="panTool" title="拖动画布">✋</button><button id="addNote" title="添加便签">▢</button><button id="addCard" title="添加素材">＋</button></div></div></main>
  <aside class="chat"><div class="chat-title"><b>Chat</b><small>下一轮接入</small></div><div id="messages" class="messages"><div class="welcome">这一轮先核对素材捕捉、卡片、分组和画布的交互。聊天功能暂不开放。</div></div><form id="chatForm"><textarea id="question" rows="3" placeholder="聊天功能下一轮开放" disabled></textarea><button type="submit" disabled>发送 ↗</button></form><p id="modeNote"></p></aside>
</div>
<div class="capture-fab"><button id="captureText">⌘ 选中文字</button><button id="captureScreen">▣ 截屏</button></div>
<dialog id="captureDialog"><form id="captureForm"><h2>记录此刻的想法</h2><div id="capturePreview"></div><textarea id="captureMemo" rows="4" placeholder="这段素材让你想到什么？你准备怎样使用它？" required></textarea><div class="dialog-actions"><button type="button" id="captureCancel">取消</button><button type="submit" class="dark">保存到画布</button></div></form></dialog>
<dialog id="cropDialog"><div class="crop-wrap"><h2>框选屏幕区域</h2><canvas id="cropCanvas"></canvas><div class="dialog-actions"><button id="cropCancel">取消</button><button id="cropConfirm" class="dark">使用选中区域</button></div></div></dialog>
<dialog id="editDialog"><form id="editForm"><div class="edit-head"><h2>编辑上下文卡片</h2><button id="editClose" type="button">×</button></div><label>标题<input id="editTitle" required></label><label>素材原文<textarea id="editText" rows="4" placeholder="截图内容可补充文字，供 AI 使用"></textarea></label><label>来源<input id="editSource" placeholder="来源应用或网址"></label><label>我当时的想法<textarea id="editMemo" rows="3"></textarea></label><label>标签<input id="editTags" placeholder="用逗号分隔"></label><label>AI 对意图的理解<textarea id="editIntent" rows="3"></textarea></label><div class="edit-row"><label>所属分组<select id="editGroup"></select></label><label>使用状态<select id="editStatus"><option value="current">用于当前脚本</option><option value="future">留作未来选题</option><option value="unused">暂不使用</option></select></label></div><div class="dialog-actions"><button id="editDelete" type="button" class="danger">删除</button><button type="submit" class="dark">保存修改</button></div></form></dialog>
<script type="module" src="/app.js"></script></body></html>
